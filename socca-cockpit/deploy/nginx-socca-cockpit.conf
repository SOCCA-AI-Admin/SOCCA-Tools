# SOCCA Sales Cockpit — nginx
#
# Ablage:   /etc/nginx/sites-available/socca-cockpit
# Aktiv:    ln -s ../sites-available/socca-cockpit /etc/nginx/sites-enabled/
# Prüfen:   nginx -t && systemctl reload nginx
#
# Zertifikat vorher mit certbot holen:
#   certbot --nginx -d cockpit.socca.example

server {
    listen 80;
    server_name cockpit.socca.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cockpit.socca.example;

    ssl_certificate     /etc/letsencrypt/live/cockpit.socca.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cockpit.socca.example/privkey.pem;

    root /srv/socca-tools/socca-cockpit/web;
    index index.html;

    # Zugriffsschutz. Benutzer anlegen mit:
    #   apt install apache2-utils
    #   htpasswd -c /etc/nginx/.htpasswd-cockpit vorname.nachname
    auth_basic           "SOCCA Sales Cockpit";
    auth_basic_user_file /etc/nginx/.htpasswd-cockpit;

    # Ohne gzip werden gut 1,6 MB übertragen, mit gzip rund ein Fünftel davon.
    gzip             on;
    gzip_min_length  1024;
    gzip_types       application/json text/html text/css application/javascript;

    # Die Seite fragt data.json mit einem Zeitstempel ab, Caching ist
    # deshalb unnötig und würde nur alte Stände zeigen.
    location = /data.json { add_header Cache-Control "no-store"; }
    location = /index.html { add_header Cache-Control "no-store"; }

    # Interner Zeitstempel des letzten Laufs, nicht nach außen geben.
    location = /.built { deny all; }

    location / { try_files $uri $uri/ =404; }

    access_log /var/log/nginx/socca-cockpit.access.log;
    error_log  /var/log/nginx/socca-cockpit.error.log;
}
