# nginx im Container "web" — liefert web/ aus, mit Passwortschutz.
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Benutzer stehen in .htpasswd im Projektordner (siehe README)
    auth_basic           "SOCCA Sales Cockpit";
    auth_basic_user_file /etc/nginx/htpasswd;

    # data.json ist 1,6 MB, komprimiert rund ein Fünftel davon
    gzip            on;
    gzip_min_length 1024;
    gzip_types      application/json text/css application/javascript;

    # Immer den neuesten Stand ausliefern
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /data.json  { add_header Cache-Control "no-store"; }

    # Interne Dateien (.built, .gitkeep) nicht ausliefern
    location ~ /\. { deny all; return 404; }

    location / { try_files $uri $uri/ =404; }
}
