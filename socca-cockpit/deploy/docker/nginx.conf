# nginx im Container "web" — liefert web/ aus.
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Kein Passwort: erreichbar für alle im internen Netz.
    #
    # Optional nur bestimmte Netze zulassen (Beispiel: Büro-LAN, VPN).
    # Zeilen aktivieren, Netze anpassen, dann: docker compose restart web
    # allow 10.10.20.0/24;
    # allow 10.10.30.0/24;
    # deny  all;
    #
    # Optional Passwortschutz wieder einschalten: die zwei Zeilen aktivieren,
    # in docker-compose.yml die Zeile mit .htpasswd aktivieren, .htpasswd
    # anlegen (README), dann: docker compose up -d
    # auth_basic           "SOCCA Sales Cockpit";
    # auth_basic_user_file /etc/nginx/htpasswd;

    # data.json ist 1,6 MB, komprimiert rund ein Fünftel davon
    gzip            on;
    gzip_min_length 1024;
    gzip_types      application/json text/css application/javascript;

    # Immer den neuesten Stand ausliefern
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /data.json  { add_header Cache-Control "no-store"; }

    # Interne Dateien (.built, .gitkeep) nicht ausliefern
    location ~ /\. { deny all; return 404; }

    # Fragefeld: an den Container "ask" weiterreichen. Über eine Variable
    # aufgelöst, damit nginx auch startet, wenn "ask" (noch) nicht läuft.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $ask_upstream http://ask:8080;
        proxy_pass $ask_upstream;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        client_max_body_size 64k;
        add_header Cache-Control "no-store";
    }

    location / { try_files $uri $uri/ =404; }
}
