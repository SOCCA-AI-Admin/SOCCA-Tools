# SOCCA Sales Cockpit — Betrieb mit Docker
#
#   docker compose up -d --build        starten bzw. nach Änderungen neu starten
#   docker compose logs -f worker       zusehen, was gerechnet wird
#   docker compose exec worker bash update.sh --force    sofort neu rechnen
#
# Erreichbar unter http://<server>:8001  (Port über COCKPIT_PORT in .env änderbar)
# Vor dem ersten Start .env anlegen — siehe README, Abschnitt Docker.
name: socca-cockpit

services:
  # Prüft regelmäßig, ob sich die Mappen geändert haben, und rechnet dann neu.
  # Der Projektordner ist eingebunden: git pull wirkt ohne Neubau des Images.
  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: socca-cockpit-worker
    restart: unless-stopped
    user: "${COCKPIT_UID:-1000}:${COCKPIT_GID:-1000}"
    environment:
      TZ: Europe/Berlin
      INTERVAL: "${COCKPIT_INTERVAL:-900}"      # Sekunden zwischen zwei Prüfungen
      # Nur falls der Server über einen Proxy ins Internet geht:
      # HTTPS_PROXY: http://proxy.example:3128
    volumes:
      - ./:/app

  # Liefert die fertige Seite aus — ohne Passwort, für alle im internen Netz.
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${COCKPIT_PORT:-8001}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./deploy/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Nur bei Passwortschutz (siehe deploy/docker/nginx.conf):
      # - ./.htpasswd:/etc/nginx/htpasswd:ro
    depends_on:
      - worker
